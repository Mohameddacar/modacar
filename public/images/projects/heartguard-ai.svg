<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Pulse Line Graphic -->
  <path d="M 100 360 L 320 360 L 360 310 L 400 420 L 450 220 L 500 480 L 540 330 L 580 370 L 620 360 L 1100 360" 
        fill="none" stroke="url(#pulse-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- UI Card Overlay -->
  <g transform="translate(140, 100)">
    <!-- Header Badge -->
    <rect width="210" height="38" rx="19" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="5" fill="#f43f5e"/>
    <text x="35" y="24" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">APPLIED AI &amp; HEALTH</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">HeartGuard AI</text>
    <text x="0" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20">Cardiovascular Risk Screening &amp; ML Diagnostics</text>

    <!-- Stats Mini-Cards -->
    <g transform="translate(0, 260)">
      <!-- Card 1 -->
      <rect width="260" height="120" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
      <text x="24" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">MODEL ARCHITECTURE</text>
      <text x="24" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">Logistic Reg.</text>
      <text x="24" y="104" fill="#10b981" font-family="system-ui, sans-serif" font-size="13">86.4% Validation Acc</text>

      <!-- Card 2 -->
      <rect x="290" width="260" height="120" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
      <text x="314" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">BACKEND INFERENCE</text>
      <text x="314" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">FastAPI Engine</text>
      <text x="314" y="104" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">&lt; 45ms Response</text>

      <!-- Card 3 -->
      <rect x="580" width="260" height="120" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155"/>
      <text x="604" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">FEATURE PIPELINE</text>
      <text x="604" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="700">14 Bio-Markers</text>
      <text x="604" y="104" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13">StandardScaler Normalization</text>
    </g>
  </g>
</svg>
